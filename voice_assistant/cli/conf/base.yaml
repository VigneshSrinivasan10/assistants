stt:
  _target_: voice_assistant.model.STT
  model: "small.en"  # Better accuracy than base.en (~40% fewer errors)
  use_gpu: true  # GPU auto-detected by whisper.cpp if CUDA available

tts:
  _target_: voice_assistant.model.TTS
  model: "kokoro"
  voice: "af_heart"
  speed: 1.0
  lang: "en-us"

llm:
  _target_: voice_assistant.model.LLM
  model_path: "models/mistral-7b-instruct-v0.1.Q4_K_M.gguf"
  n_ctx: 2048
  max_conversations: 10  # Legacy parameter (unused with smart memory)
  memory_file: "data/smart_memory.json"  # New file for smart memory
  use_smart_memory: true  # Enable quality filtering + relevance scoring
  temperature: 0.2
  top_p: 0.9
  repeat_penalty: 1.2
  max_tokens: 25
  echo: false

stream:
  wake_word: "computer"
  modality: "audio"
  mode: "send-receive"
  can_interrupt: true
  algo_options:
    # Optimized for low latency
    audio_chunk_duration: 0.4  # Reduced from 0.6 for faster response
    started_talking_threshold: 0.15  # More sensitive start detection
    speech_threshold: 0.08  # Lower threshold for better detection
  model_options:
    # VAD optimizations for accuracy + speed
    threshold: 0.4  # Lower = more sensitive, catches more speech
    min_speech_duration_ms: 200  # Reduced from 250ms for faster detection
    max_speech_duration_s: 30
    min_silence_duration_ms: 1500  # Reduced from 2000ms for faster cutoff
    window_size_samples: 512  # Reduced from 1024 for lower latency
    speech_pad_ms: 300  # Reduced padding for faster processing
  port: 7860
